PLG_SYSTEM_FESTIVEOVERLAY="System - Festive Overlay"
PLG_SYSTEM_FESTIVEOVERLAY_FIELD_ENABLED_LABEL="Enable festive effects"
PLG_SYSTEM_FESTIVEOVERLAY_FIELD_ENABLED_DESC="Show seasonal decorations on public HTML pages. Visitors can pause or hide them. Reduced motion starts paused; sound always starts muted."
PLG_SYSTEM_FESTIVEOVERLAY_EFFECT_LABEL="Seasonal effect"
PLG_SYSTEM_FESTIVEOVERLAY_EFFECT_DESC="Automatic selects New Year on 1 January in the visitor's time zone, and Christmas during the configured UTC snow season on other dates. New Year runs only from midnight until 02:00."
PLG_SYSTEM_FESTIVEOVERLAY_EFFECT_AUTO="Automatic: Christmas and New Year"
PLG_SYSTEM_FESTIVEOVERLAY_EFFECT_SNOW="Christmas snow and sleigh"
PLG_SYSTEM_FESTIVEOVERLAY_EFFECT_FIREWORKS="New Year fireworks and drones"
PLG_SYSTEM_FESTIVEOVERLAY_START_LABEL="Snow season starts"
PLG_SYSTEM_FESTIVEOVERLAY_END_LABEL="Snow season ends"
PLG_SYSTEM_FESTIVEOVERLAY_DATES_DESC="Inclusive UTC date in MM-DD format, for example 12-01. The range can cross New Year. Invalid values fall back to 1 December or 6 January."
PLG_SYSTEM_FESTIVEOVERLAY_SLEIGH_LABEL="Show Father Christmas's sleigh"
PLG_SYSTEM_FESTIVEOVERLAY_DRONE_LABEL="Include drone displays"
PLG_SYSTEM_FESTIVEOVERLAY_SOUND_LABEL="Allow visitor-controlled sound"
PLG_SYSTEM_FESTIVEOVERLAY_SOUND_DESC="Show a mute/unmute control for fireworks. Sound starts only after the visitor presses it."
PLG_SYSTEM_FESTIVEOVERLAY_PALETTE_LABEL="Snow palette"
PLG_SYSTEM_FESTIVEOVERLAY_PALETTE_AUTO="Detect the page background"
PLG_SYSTEM_FESTIVEOVERLAY_PALETTE_LIGHT="Light page: dark snow"
PLG_SYSTEM_FESTIVEOVERLAY_PALETTE_DARK="Dark page: white snow"
PLG_SYSTEM_FESTIVEOVERLAY_POSITION_LABEL="Visitor controls position"
PLG_SYSTEM_FESTIVEOVERLAY_POSITION_DESC="Place the icons immediately above the Our Next Walks heading. Pages without that heading use the bottom-right corner. Fixed corner positions are also available."
PLG_SYSTEM_FESTIVEOVERLAY_POSITION_WALKS="Above Our Next Walks"
PLG_SYSTEM_FESTIVEOVERLAY_POSITION_RIGHT="Bottom right"
PLG_SYSTEM_FESTIVEOVERLAY_POSITION_LEFT="Bottom left"
