name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser runtime
        run: node --test tests/overlay.test.cjs
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Validate and build the Joomla package
        run: |
          python scripts/build_package.py --check
          python scripts/build_package.py
      - name: Prepare demonstration assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          packages = list(Path("dist").glob("*.zip"))
          if len(packages) != 1:
              raise SystemExit("Expected exactly one installer ZIP")
          subprocess.run(["python", "scripts/prepare_demo.py", str(packages[0])], check=True)
          PY
      - name: Check Prodockit assets
        run: prodockit shared-files --check
      - name: Build documentation
        run: zensical build --clean --strict
      - uses: actions/upload-artifact@v4
        with:
          name: festive-overlay-development-package
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: festive-overlay-documentation
          path: site/
          if-no-files-found: error

      - name: Upload Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    name: Deploy documentation to Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
